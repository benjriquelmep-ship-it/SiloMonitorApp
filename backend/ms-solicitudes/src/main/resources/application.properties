spring.application.name=ms-solicitudes

# Puerto distinto a ms-silos (8080) para poder levantar ambos al mismo tiempo
server.port=8081

# Base de datos propia del microservicio (MySQL / XAMPP). Se crea sola si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/solicitudes_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# update: Hibernate crea o actualiza la tabla "solicitudes" a partir de la entidad
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false