spring.application.name=ms-silos

# Puerto del microservicio. La app Android lo llama en http://10.0.2.2:8080 (emulador)
server.port=8080

# Base de datos MySQL. createDatabaseIfNotExist crea la BD "silos_db" si no existe.
# Usuario/clave por defecto de XAMPP: root sin clave. Cambialos si tu MySQL usa otros.
spring.datasource.url=jdbc:mysql://localhost:3306/silos_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# update: Hibernate crea/ajusta las tablas a partir de las clases @Entity sin borrar los datos
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que se ejecuta (util para la defensa)
spring.jpa.show-sql=true
spring.jpa.open-in-view=false